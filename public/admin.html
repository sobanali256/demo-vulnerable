<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NoteNest Admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:32px auto;padding:0 16px;color:#18181b}
h1{font-size:22px;margin:0 0 4px}p{color:#52525b;margin:0 0 20px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e4e4e7}
th{font-size:12px;text-transform:uppercase;color:#71717a}code{font-size:12px;color:#71717a}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #dc2626;color:#dc2626;background:#fff;border-radius:4px}
</style>
</head>
<body>
  <h1>Admin console</h1>
  <p>Manage NoteNest users.</p>
  <table>
    <thead><tr><th>ID</th><th>Email</th><th>Role</th><th>Password hash</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    // PLANTED FLAW (with server.js): no session check before showing every user.
    fetch("/api/users").then((r) => r.json()).then((users) => {
      const rows = document.getElementById("rows");
      for (const u of users) {
        const tr = document.createElement("tr");
        for (const v of [u.id, u.email, u.role, u.passwordHash]) {
          const td = document.createElement("td");
          td.textContent = String(v);
          tr.appendChild(td);
        }
        const td = document.createElement("td");
        const b = document.createElement("button");
        b.textContent = "Delete";
        td.appendChild(b);
        tr.appendChild(td);
        rows.appendChild(tr);
      }
    });
  </script>
</body>
</html>
